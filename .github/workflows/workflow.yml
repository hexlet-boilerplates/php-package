# Name of workflow
name: PHP CI

# Trigger the workflow on push or pull request
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:

    # The type of machine to run the job on
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # PHP с драйвером покрытия приходит из setup-php, поэтому mise не должен
    # ставить свой conda:php ни в mise-action, ни через шимы в следующих шагах
    env:
      MISE_DISABLE_TOOLS: conda:php

    steps:
        # Check-out repository under GitHub workspace
        # https://github.com/actions/checkout
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Драйвер покрытия (Xdebug) в mise поставить нечем, поэтому PHP для CI
      # приходит из setup-php, а mise ставит остальное: composer, mago и hk
      # https://github.com/shivammathur/setup-php
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: xdebug
          tools: none
      # Ставит composer, mago и hk из mise.toml, версии зафиксированы в mise.lock
      # https://github.com/jdx/mise-action
      - uses: jdx/mise-action@v5
      - name: Install
        # Install project
        run: make install
      - name: Run checks
        # Те же шаги, что в git-хуке (hk.pkl)
        run: mise exec -- hk check --all

        # The coverage threshold is COVERAGE_MIN in the Makefile — this step fails
        # when coverage drops below it, so the CI badge reflects coverage too
      - name: Run tests
        run: make test-coverage
