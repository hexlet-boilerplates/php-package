# Инструменты проекта. На macOS и Linux их ставит `mise install`.
# conda-бэкенд mise считает экспериментальным, без флага php не установится.
[settings]
experimental = true

[tools]
"conda:php" = "latest"
"github:composer/composer" = "latest"
"aqua:carthage-software/mago" = "latest"
# hk запускает проверки в git-хуках и в CI (hk.pkl), pkl нужен ему для чтения конфига.
rumdl = "latest"
typos = "latest"
jactionlint = "latest"
shellcheck = "latest"
hk = "latest"
pkl = "latest"
